# ============================================================
# ZyraxonOS — Hyprland glass desktop
# Real GPU blur, real animations, real transparency.
# ============================================================

$mod = SUPER

monitor = , preferred, auto, 1

exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ---------------- look: glass ----------------
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(7c5cffee) rgba(00d4ffee) 45deg
    col.inactive_border = rgba(ffffff22)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 22
    rounding_power = 2.4

    active_opacity = 0.96
    inactive_opacity = 0.86
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 12
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.02
        contrast = 1.05
        brightness = 1.0
        vibrancy = 0.30
        popups = true
    }

    shadow {
        enabled = true
        range = 32
        render_power = 4
        color = rgba(00000055)
    }

    dim_inactive = true
    dim_strength = 0.06
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 6, wind, popin 80%
    animation = windowsIn, 1, 6, winIn, popin 88%
    animation = windowsOut, 1, 4, winOut, popin 88%
    animation = windowsMove, 1, 5, wind
    animation = border, 1, 12, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 6, wind
    animation = workspaces, 1, 6, wind, slide
    animation = layers, 1, 4, wind, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master { new_status = master }

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ---------------- input ----------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ---------------- keybinds ----------------
$terminal = kitty
$menu = wofi --show drun --allow-images
$files = thunar

bind = $mod, RETURN, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, TAB, exec, $menu
bind = $mod, Q, killactive,
bind = $mod, E, exec, $files
bind = $mod, F, fullscreen,
bind = $mod, L, exec, hyprlock
bind = $mod, SPACE, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = opacity 0.94 0.86, class:^(kitty)$
windowrulev2 = opacity 0.96 0.88, class:^(thunar)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = size 800 600, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$

layerrule = blur, waybar
layerrule = ignorealpha 0.2, waybar
layerrule = blur, wofi
layerrule = ignorealpha 0.2, wofi
layerrule = blur, dunst
layerrule = ignorealpha 0.2, dunst
layerrule = blur, swayosd
