# ============================================================
# ZyraxonOS — picom compositor configuration
#
# This is what makes real glass. picom blurs whatever is BEHIND a
# translucent window (dual_kawase), so panels, menus and windows look
# like frosted glass over the live wallpaper - not a flat PNG.
# ============================================================

# --- backend ---
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# --- shadows: soft, wide, low opacity (glass sits above the desktop) ---
shadow = true;
shadow-radius = 34;
shadow-opacity = 0.42;
shadow-offset-x = 0;
shadow-offset-y = 12;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# --- real frosted-glass blur ---
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 7;
blur-background-frame = false;
blur-background-fixed = false;

# blur everything that is translucent, and nothing else
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- corner rounding (matches the glass chip radius) ---
corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Xfce4-panel'"
];

# --- smooth fades ---
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 12;

# --- avoid tearing / lag on panels ---
unredir-if-possible = false;
detect-transient = true;
detect-client-leader = true;

# --- per-window rules ---
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.92; focus = true; blur-background = true; };
  popup_menu = { opacity = 0.97; blur-background = true; };
  dropdown_menu = { opacity = 0.97; blur-background = true; };
  normal = { blur-background = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  desktop = { shadow = false; blur-background = false; };
};
